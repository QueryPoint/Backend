[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
markers =
    unit: isolated tests with mocks only
    api: router/API contract tests
    integration: tests requiring real infrastructure
    websocket: WebSocket tests
    health: external service availability checks
    load: load-testing assets
asyncio_mode = auto
